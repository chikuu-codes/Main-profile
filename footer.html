<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCentral Footer</title>
  <style>
    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #120e24; /* Background matching EduCentral dark theme */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* EduCentral Footer Panel Container */
    .educentral-footer {
      width: 100%;
      background: linear-gradient(180deg, rgba(30, 16, 60, 0.95) 0%, rgba(18, 14, 36, 1) 100%);
      border-top: 1px solid rgba(147, 51, 234, 0.2);
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.3);
    }

    /* Inner Card Wrapper */
    .footer-card {
      background-color: #f7f7fc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 24px 36px;
      max-width: 650px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    /* Header Section: <Contact> */
    .contact-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #3b1d60;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    /* Team Members Links Grid */
    .team-links-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    /* Member Link Pills */
    .member-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      background: linear-gradient(135deg, #6b21a8 0%, #a855f7 50%, #d946ef 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 25px;
      transition: all 0.25s ease-in-out;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
    }

    .member-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(168, 85, 247, 0.55);
      background: linear-gradient(135deg, #581c87 0%, #9333ea 50%, #c026d3 100%);
    }

    .member-link:active {
      transform: translateY(0);
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .footer-card {
        padding: 20px 16px;
      }
      
      .team-links-container {
        flex-direction: column;
        width: 100%;
      }

      .member-link {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Footer Section Start -->
  <footer class="educentral-footer">
    <div class="footer-card">
      <div class="contact-title">&lt;Contact&gt;</div>
      
      <div class="team-links-container">
        <!-- Change href="contact.html" to your main contact page URL -->
        <a href="contact.html" class="member-link">Muskaan</a>
        <a href="contact.html" class="member-link">Tanuja</a>
        <a href="contact.html" class="member-link">Rohan</a>
        <a href="contact.html" class="member-link">Udit</a>
      </div>
    </div>
  </footer>
  <!-- Footer Section End -->

</body>
</html>
