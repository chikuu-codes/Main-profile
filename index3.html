<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udit - BGMI Character Showcase</title>
  <style>
    /* Reset & Base Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: #0a0a0c;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Main Container */
    .showcase-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      margin: 20px auto;
      background: radial-gradient(circle at center, #181920 0%, #08080a 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Background Ambient Grid Effect */
    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Character Image Stage */
    .character-stage {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 80%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .character-img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9));
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* HUD Header Title */
    .hud-title {
      position: absolute;
      top: 25px;
      left: 30px;
      font-size: 14px;
      letter-spacing: 3px;
      color: #a1a1aa;
      text-transform: uppercase;
      border-left: 3px solid #e11d48;
      padding-left: 10px;
    }

    /* Pin Lines & HUD Badges Style */
    .pin-container {
      position: absolute;
      pointer-events: auto;
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .pin-dot {
      width: 10px;
      height: 10px;
      background-color: #e11d48;
      border-radius: 50%;
      box-shadow: 0 0 10px #e11d48, 0 0 20px #e11d48;
      position: relative;
    }

    .pin-dot::after {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(225, 29, 72, 0.6);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .pin-line {
      height: 2px;
      background: linear-gradient(90deg, #e11d48, rgba(225, 29, 72, 0.2));
      transition: width 0.3s ease;
    }

    .pin-badge {
      background: rgba(18, 18, 24, 0.85);
      border: 1px solid rgba(225, 29, 72, 0.4);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .pin-badge:hover {
      background: rgba(225, 29, 72, 0.2);
      border-color: #e11d48;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(225, 29, 72, 0.4);
    }

    .badge-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      display: block;
    }

    /* Individual Pin Positions */
    /* Pin 1: Name (Top Right) */
    #pin-name { top: 22%; left: 55%; }
    #pin-name .pin-line { width: 80px; }

    /* Pin 2: Branch (Upper Left) */
    #pin-branch { top: 32%; right: 55%; flex-direction: row-reverse; }
    #pin-branch .pin-line { width: 90px; background: linear-gradient(-90deg, #e11d48, rgba(225, 29, 72, 0.2)); }

    /* Pin 3: WhatsApp (Mid Left) */
    #pin-whatsapp { top: 48%; right: 58%; flex-direction: row-reverse; }
    #pin-whatsapp .pin-line { width: 70px; background: linear-gradient(-90deg, #e11d48, rgba(225, 29, 72, 0.2)); }

    /* Pin 4: LinkedIn (Mid Right) */
    #pin-linkedin { top: 56%; left: 56%; }
    #pin-linkedin .pin-line { width: 100px; }

    /* Pin 5: Email (Bottom Left) */
    #pin-email { top: 72%; right: 54%; flex-direction: row-reverse; }
    #pin-email .pin-line { width: 80px; background: linear-gradient(-90deg, #e11d48, rgba(225, 29, 72, 0.2)); }

    /* Interactive Angle Controls */
    .controls-panel {
      position: absolute;
      bottom: 25px;
      display: flex;
      gap: 12px;
      background: rgba(15, 15, 20, 0.8);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .control-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .control-btn.active, .control-btn:hover {
      background: #e11d48;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(225, 29, 72, 0.5);
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 768px) {
      .showcase-container { height: 95vh; margin: 10px; }
      .pin-line { display: none; }
      #pin-name { top: 15%; left: 5%; }
      #pin-branch { top: 25%; right: 5%; }
      #pin-whatsapp { top: 60%; left: 5%; }
      #pin-linkedin { top: 70%; right: 5%; }
      #pin-email { top: 80%; left: 5%; }
    }
  </style>
</head>
<body>

  <div class="showcase-container">
    <div class="bg-grid"></div>

    <div class="hud-title">
      DIRECTIVE MODE
    </div>

    <!-- Character Image -->
    <div class="character-stage">
      <img id="character-img" src="rohan.jpg" alt="BGMI Character - Rohan" class="character-img">
    </div>

    <!-- 5 Floating HUD Pin Lines -->

    <!-- Pin 1: Name -->
    <div class="pin-container" id="pin-name">
      <div class="pin-dot"></div>
      <div class="pin-line"></div>
      <div class="pin-badge">
        <div>
          <span class="badge-label">OPERATIVE</span>
          <strong>Rohan</strong>
        </div>
      </div>
    </div>

    <!-- Pin 2: Branch -->
    <div class="pin-container" id="pin-branch">
      <div class="pin-dot"></div>
      <div class="pin-line"></div>
      <div class="pin-badge">
        <div>
          <span class="badge-label">SPECIALIZATION</span>
          <strong>CSE</strong>
        </div>
      </div>
    </div>

    <!-- Pin 3: WhatsApp -->
    <div class="pin-container" id="pin-whatsapp">
      <div class="pin-dot"></div>
      <div class="pin-line"></div>
      <a href="https://wa.me/1234567890" target="_blank" class="pin-badge">
        <div>
          <span class="badge-label">COMM CHANNEL</span>
          <strong>WhatsApp</strong>
        </div>
      </a>
    </div>

    <!-- Pin 4: LinkedIn -->
    <div class="pin-container" id="pin-linkedin">
      <div class="pin-dot"></div>
      <div class="pin-line"></div>
      <a href="https://linkedin.com" target="_blank" class="pin-badge">
        <div>
          <span class="badge-label">NETWORK</span>
          <strong>LinkedIn</strong>
        </div>
      </a>
    </div>

    <!-- Pin 5: Email -->
    <div class="pin-container" id="pin-email">
      <div class="pin-dot"></div>
      <div class="pin-line"></div>
      <a href="mailto:udit@example.com" class="pin-badge">
        <div>
          <span class="badge-label">DIRECT MAIL</span>
          <strong>Email</strong>
        </div>
      </a>
    </div>

  </div>

  <script>
    // View switching function
    function switchView(viewType, btn) {
      const img = document.getElementById('character-img');
      
      // Remove active class from all buttons
      document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Adjust scale/rotation to simulate inspection view
      if (viewType === 'front') {
        img.style.transform = 'scale(1) rotate(0deg)';
      } else if (viewType === 'top') {
        img.style.transform = 'scale(0.85) rotateX(35deg) translateY(-20px)';
      } else if (viewType === 'bottom') {
        img.style.transform = 'scale(1.1) translateY(30px)';
      }
    }
  </script>
</body>
</html>
